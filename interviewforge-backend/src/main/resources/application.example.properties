```properties
# ==========================================
# InterviewForge AI - Application
# ==========================================
spring.application.name=interviewforge-ai

# ==========================================
# Database - PostgreSQL
# ==========================================
spring.datasource.url=${SPRING_DATASOURCE_URL:${DATABASE_URL:jdbc:postgresql://localhost:5433/interviewforge}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DATABASE_USERNAME:postgres}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DATABASE_PASSWORD:}}

# ==========================================
# JPA / Hibernate
# ==========================================
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:false}

# ==========================================
# JWT Security
# ==========================================
jwt.secret=${JWT_SECRET}

# ==========================================
# Google GenAI - Chat
# ==========================================
spring.ai.google.genai.api-key=${GOOGLE_GENAI_API_KEY:${SPRING_AI_GOOGLE_GENAI_API_KEY:}}
spring.ai.google.genai.chat.model=${GOOGLE_GENAI_CHAT_MODEL:gemini-3.5-flash}

# ==========================================
# Google GenAI - Embeddings
# ==========================================
spring.ai.google.genai.embedding.api-key=${GOOGLE_GENAI_API_KEY:${SPRING_AI_GOOGLE_GENAI_API_KEY:}}
spring.ai.google.genai.embedding.text.model=${GOOGLE_GENAI_EMBEDDING_MODEL:gemini-embedding-001}
spring.ai.google.genai.embedding.text.dimensions=${GOOGLE_GENAI_EMBEDDING_DIMENSIONS:768}
spring.ai.google.genai.embedding.text.task-type=RETRIEVAL_DOCUMENT

# ==========================================
# PGVector
# ==========================================
spring.ai.vectorstore.pgvector.initialize-schema=${PGVECTOR_INITIALIZE_SCHEMA:true}
spring.ai.vectorstore.pgvector.dimensions=${PGVECTOR_DIMENSIONS:768}
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE
spring.ai.vectorstore.pgvector.index-type=HNSW

# ==========================================
# Groq
# ==========================================
groq.api-key=${GROQ_API_KEY:}
groq.base-url=${GROQ_BASE_URL:https://api.groq.com/openai/v1}
groq.model=${GROQ_MODEL:openai/gpt-oss-120b}

# ==========================================
# OpenRouter
# ==========================================
openrouter.api-key=${OPENROUTER_API_KEY:}
openrouter.base-url=${OPENROUTER_BASE_URL:https://openrouter.ai/api/v1}
openrouter.model=${OPENROUTER_MODEL:openrouter/free}

# ==========================================
# CORS
# Set CORS_ALLOWED_ORIGINS in Render to your
# deployed frontend URL.
# ==========================================
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174}

# ==========================================
# MVC Views (only if the application uses JSP)
# ==========================================
spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp
```
