<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/images/interviewforge-icon.png" />
    <link rel="shortcut icon" href="/images/interviewforge-icon.png" />
    <link rel="apple-touch-icon" href="/images/interviewforge-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="InterviewForge AI - AI-powered interview preparation with resume analysis, mock interviews, and detailed performance reports."
    />
    <meta name="theme-color" content="#0F1221" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>InterviewForge AI - AI Interview Preparation</title>
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("interviewforge_theme");
          var prefersDark =
            window.matchMedia &&
            window.matchMedia("(prefers-color-scheme: dark)").matches;
          if (stored === "dark" || (!stored && prefersDark)) {
            document.documentElement.classList.add("dark");
          }
        } catch (e) {
          /* storage unavailable - keep light theme */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
